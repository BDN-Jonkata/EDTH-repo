name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Seeder tests and catalog check
        run: |
          python -m unittest discover -s seeder/tests
          python seeder/seed_catalog.py --check

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check
        run: for f in ui/viewer/*.js; do node --check "$f"; done
      - name: Viewer tests
        run: |
          status=0
          for f in ui/viewer/test-*.js; do
            echo "== $f"
            node "$f" || status=1
          done
          exit $status
